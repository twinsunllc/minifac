name: sdd-sentinel-inject
description: |
  SDD loop running on the `runner-sentinel-injection` change in a fresh
  minifac worktree. First of two dogfoods preparing for the
  factory-inputs keystone.

nodes:
  propose:
    executor: claude
    cwd: /Users/jami/projects/minifac-sentinel-inject
    with:
      permission_mode: "bypass_permissions"
      prompt: |
        You are running the propose step of the SDD loop for change
        `runner-sentinel-injection`. Work in the current directory,
        which is a worktree of minifac branched off main.

        ## Intent for this change

        The binding decision for this change is captured at
        `docs/decisions/0007-Sentinel-Runner-Injects.md`. Read it
        first. Also read `docs/concepts/Sentinel.md`,
        `docs/concepts/Runner.md`, `docs/concepts/Executor.md`, and
        the canonical spec at `openspec/specs/node-executor/spec.md`.

        The change implements decision 0007: move the
        `## Status signaling` boilerplate from per-factory prompts
        into the runner. Concretely:

        - The `claude` executor (`src/executor/claude.ts`) MUST
          auto-append a standard sentinel-emission instruction block
          to every prompt it sends, BEFORE the existing stream-json
          serialization. The block teaches the model the regex
          format, where to emit (final assistant text), and the
          fallback-to-exit-code behavior. Use the exact regex from
          the canonical spec (`/^MINIFAC_STATUS:[ \t]*...`).

        - Add a per-node opt-out knob in the claude executor's `with:`
          schema: `emit_sentinel_instructions: bool`, default `true`.
          When `false`, no instructions are appended (for future
          executors or unusual cases that don't want them).

        - The `examples/sdd.yaml` factory MUST be migrated:
          - Remove the entire `## Status signaling` block from each
            of the four nodes' prompts.
          - Keep the per-node success/failure *criteria* — what
            "succeeded" or "failed" means for that node, in prose,
            before the sentinel block was. Move that criteria
            inline if needed so the model still knows what to report.
          - Adjust `examples/sdd.md` per-node contract docs to reflect
            the new prompt shape.

        - The canonical `openspec/specs/node-executor/spec.md` MUST
          be updated to reflect the auto-injection behavior. Likely
          shape: MODIFIED requirement on the existing "Status
          signaling via sentinel marker" requirement, ADDED scenario
          for the opt-out knob, ADDED scenario asserting the
          injected block appears in the constructed prompt.

        - Tests: snapshot test for the constructed prompt with the
          new injected block (so future format changes are
          deliberate); test for the opt-out behavior; SDD example
          structural test updated to no longer assert
          `MINIFAC_STATUS` substring in each prompt (that's the
          runner's job now, not the factory's).

        ## Hard out of scope

        - Brief schema, brief handling, factory-inputs work — that's
          the next change.
        - New executor types (shell, codex). Not this change.
        - Daemon / viewer / serve. Not this change.
        - Anti-goals: do NOT introduce premature abstractions; the
          opt-out knob is the only new public surface.

        ## What you must produce

        1. Run `openspec new change runner-sentinel-injection`.
        2. Write `proposal.md`, `design.md`, spec deltas, `tasks.md`.
        3. Run `openspec validate runner-sentinel-injection` and
           iterate until it exits 0.

        ## Status signaling

        Your final assistant message MUST end with the literal
        `MINIFAC_STATUS:` sentinel line. The runner parses this line
        to decide whether to schedule the next node; it does not
        look at your CLI exit code.

        - On success (you got `openspec validate
          runner-sentinel-injection` to exit 0 and every required
          artifact is on disk), end your final message with exactly
          this line and nothing after it:

              MINIFAC_STATUS: succeeded

        - On failure (you could not get validate clean, or a required
          artifact could not be written), end your final message
          with exactly these two lines and nothing after them:

              MINIFAC_STATUS: failed
              REASON: <one-line description of the unresolved validation error>

        The sentinel must be the last thing in your message.

  apply:
    executor: claude
    cwd: /Users/jami/projects/minifac-sentinel-inject
    with:
      permission_mode: "bypass_permissions"
      prompt: |
        You are running the apply step of the SDD loop for change
        `runner-sentinel-injection`. The propose step already landed
        the proposal, design, spec deltas, and tasks under
        `openspec/changes/runner-sentinel-injection/`. Prior node
        output is in your run-wide history — if this is a retry, the
        verify failure that sent you back is in there too.

        Respect the project rules in `CLAUDE.md` and the anti-goals
        captured in `docs/decisions/0013-Anti-Goals.md`. Do not add
        new runtime dependencies. Do not refactor unrelated code.

        Do all of the following:

        1. Read `openspec/changes/runner-sentinel-injection/tasks.md`.
        2. Work each unchecked `- [ ]` task. Make the code changes,
           mark each task `- [x]` as you finish it.
        3. Commit progress when it makes sense; do not push.

        ## Status signaling

        Your final assistant message MUST end with the literal
        `MINIFAC_STATUS:` sentinel line.

        - On success (every checkbox in tasks.md is `- [x]`), end
          your final message with exactly this line:

              MINIFAC_STATUS: succeeded

        - On failure (a task is structurally impossible), end with:

              MINIFAC_STATUS: failed
              REASON: <one-line description naming the blocking task>

  verify:
    executor: claude
    cwd: /Users/jami/projects/minifac-sentinel-inject
    with:
      permission_mode: "bypass_permissions"
      prompt: |
        You are running the verify step of the SDD loop for change
        `runner-sentinel-injection`. Prior propose and apply output
        is in your run-wide history.

        Run the minifac repo's verify commands in the current
        directory:

            npm run build
            npm test
            npm run check
            openspec validate runner-sentinel-injection

        Do NOT start the daemon or hit any network — verify is a
        static-checks pass only.

        ## Status signaling

        Your final assistant message MUST end with the literal
        `MINIFAC_STATUS:` sentinel line. Your failure output will be
        in the apply node's history on the next iteration, so the
        REASON line needs to be diagnosable.

        - On success (every verify command exited 0):

              MINIFAC_STATUS: succeeded

        - On failure (any verify command exited non-zero):

              MINIFAC_STATUS: failed
              REASON: <one-line description naming the failing command and the relevant output>

  archive:
    executor: claude
    cwd: /Users/jami/projects/minifac-sentinel-inject
    terminal: true
    with:
      permission_mode: "bypass_permissions"
      prompt: |
        You are running the archive step of the SDD loop for change
        `runner-sentinel-injection`. Verify has passed.

        Run `openspec archive runner-sentinel-injection`. After it
        exits 0, stage all changes and commit with subject
        `Archive: runner-sentinel-injection` and a 2-3 line body
        describing what was folded into canonical specs and what
        change directory was moved. Include the trailing
        `Co-Authored-By: Claude Opus 4.7 (1M context)
        <noreply@anthropic.com>` line. Do not push.

        If `openspec archive` exits non-zero, do NOT commit. If the
        commit itself fails (e.g. a hook rejects), that is a node
        failure.

        ## Status signaling

        Your final assistant message MUST end with the literal
        `MINIFAC_STATUS:` sentinel line.

        - On success (archive exited 0 AND commit exited 0):

              MINIFAC_STATUS: succeeded

        - On failure (archive errored, or the commit was rejected):

              MINIFAC_STATUS: failed
              REASON: <one-line description naming the archive or commit error>

edges:
  - from: propose
    to: apply
  - from: apply
    to: verify
  - from: verify
    to: archive
  - from: verify
    to: apply
    when: on_failure
    max_traversals: 3
