name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + test + lint (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Defense against publish-then-yank supply-chain attacks. Runs
      # before install so a fresh dep can't execute postinstall hooks
      # even once. See docs/decisions/0024-CI-Security-Policy.md.
      - name: Check dependency freshness (3-day cooldown)
        run: npm run check:dep-freshness

      - name: Install dependencies
        run: npm ci

      - name: Lint + format check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
