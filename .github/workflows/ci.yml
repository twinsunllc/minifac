name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + test + lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "22"
          cache: npm

      # Defense against publish-then-yank supply-chain attacks. Runs
      # before install so a fresh dep can't execute postinstall hooks
      # even once. See docs/decisions/0024-CI-Security-Policy.md.
      - name: Check dependency freshness (3-day cooldown)
        run: npm run check:dep-freshness

      - name: Install dependencies
        run: npm ci

      - name: Lint + format check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
