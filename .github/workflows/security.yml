name: security

on:
  schedule:
    # Nightly at 06:00 UTC (01:00 CT). Off-peak for npm registry.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit (production deps, high+)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Audit production deps (high + critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit full tree (informational)
        if: always()
        run: npm audit --audit-level=moderate || true
