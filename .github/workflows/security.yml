name: security

on:
  schedule:
    # Nightly at 06:00 UTC (01:00 CT). Off-peak for npm registry.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit (full tree, high+)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "22"
          cache: npm

      # Scans the full dep tree (no --omit=dev). Dev deps run on CI
      # via postinstall hooks and are a real supply-chain surface;
      # see docs/decisions/0024-CI-Security-Policy.md for the
      # rationale.
      - name: Audit full tree (high + critical)
        run: npm audit --audit-level=high

      # Moderates are informational: visible in the log without
      # failing the job. Promote anything that looks load-bearing
      # to a tracked issue + a real fix.
      - name: Audit full tree (moderate, informational)
        if: always()
        run: npm audit --audit-level=moderate || true
