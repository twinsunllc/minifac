name: sdd-serve-fixes
description: |
  SDD loop running on the `serve-and-viewer-fixes` change in a fresh
  worktree branched off the `serve-and-viewer` branch. Closes the two
  must-fix items from the code review.

nodes:
  propose:
    executor: claude
    cwd: /Users/jami/projects/minifac-sv-fixes
    with:
      permission_mode: "bypass_permissions"
      prompt: |
        You are running the propose step of the SDD loop for change
        serve-and-viewer-fixes. Work in the current directory, which
        is an OpenSpec-equipped worktree of minifac branched off the
        serve-and-viewer change (commit fcc3985). The serve-daemon
        capability is canonical here at
        `openspec/specs/serve-daemon/spec.md`.

        ## Intent for this change

        The user (Jami) has captured the following intent. Refine the
        design within these constraints. Do not contradict them; if a
        constraint feels wrong, surface it as an Open Question in
        design.md rather than silently changing it.

        ### Background

        The serve-and-viewer change shipped the `minifac serve`
        daemon, web viewer, and SSE event stream. A code review of
        that change identified two must-fix items before merge. This
        change fixes both. Anything beyond those two items is out of
        scope — keep this tight.

        ### The two must-fixes

        **1. SIGINT does not close in-flight SSE streams.**
        `src/serve/server.ts` and `src/serve/run-registry.ts`.
        Currently, `DaemonHandle.close()` calls `watcher.close()` and
        `server.close()`. `server.close()` stops accepting new
        connections but does NOT terminate existing in-flight
        connections — for SSE streams, that means an active subscriber
        can hold the daemon open indefinitely after SIGINT.

        The canonical `serve-daemon` spec at
        `openspec/specs/serve-daemon/spec.md` says SIGINT must close
        any open SSE streams. The implementation violates that
        scenario.

        Fix: track active SSE writers (likely as a `Set` either in
        `RunRegistry` or at the daemon level), and explicitly close
        each one when `DaemonHandle.close()` is invoked. The existing
        `SseWriter.close()` method handles the response side; you just
        need to call it on shutdown.

        Add or update a test in `src/serve/server.test.ts` (or
        `run-registry.test.ts`) that asserts: with an active SSE
        subscriber attached to a running run, calling `close()` on the
        daemon causes the subscriber's stream to end cleanly within a
        small time bound. The test must fail against the current code
        and pass after the fix.

        **2. `Last-Event-ID` NaN handling silently replays from index
        0.** `src/serve/server.ts` around line 292.

        Current code:
        ```ts
        const lastId = lastIdRaw === undefined ? undefined : Number.parseInt(lastIdRaw, 10);
        const lastIndex = Number.isFinite(lastId) ? (lastId as number) : undefined;
        ```

        If the header is garbage (e.g. `"abc"`), `parseInt` returns
        `NaN`, `Number.isFinite(NaN)` is false, `lastIndex` becomes
        `undefined`, and the subscribe path replays from index 0 —
        the OPPOSITE of what a reconnecting client wants. A header
        like `Last-Event-ID: 0` is parsed correctly (returns 0 → start
        from 1), so the only bug case is unparseable input.

        Fix: distinguish "header absent" from "header malformed". On
        malformed input either return HTTP 400 with a clear message,
        OR treat malformed as undefined explicitly with a documented
        comment (current behavior, but the comment is missing). Pick
        one and be deliberate. Prefer 400 — silent fallback is the
        opposite of what the client wants and is hard to debug.

        Add a test that sends `Last-Event-ID: not-a-number` and
        asserts a 400 (or whatever you decide). Add a test for
        `Last-Event-ID: 0` confirming it means "resume from index 1"
        (i.e., skip the event at index 0).

        ### Out of scope

        These are real follow-ups from the review but NOT part of this
        change:

        - SSE heartbeat / keepalive
        - "Safe root" cwd check the design promised
        - Static path resolution refactor + percent-decode test
        - Trusting `Host` header for URL base
        - Viewer reconnect UI feedback
        - Refuse-to-start on missing watched directory

        Mention each briefly in `design.md`'s Open Questions section
        as deferred follow-ups, but do NOT implement them.

        ### Spec impact

        The canonical `serve-daemon` spec already contains a scenario
        about SIGINT closing SSE streams (see the canonical spec). The
        implementation doesn't honor it. You don't necessarily need a
        spec delta — but if you do MODIFY anything, make the spec
        wording more specific about what "closes" means (e.g. "the
        daemon SHALL actively terminate active SSE responses, not
        merely stop accepting new connections"). Use your judgment.

        For the Last-Event-ID behavior, the spec is silent on
        malformed input. ADD a requirement (or scenario) that pins
        whichever behavior you choose (400 or documented silent
        fallback).

        ## What you must produce

        Read first: `CLAUDE.md`, `openspec/specs/serve-daemon/spec.md`,
        `src/serve/server.ts`, `src/serve/run-registry.ts`,
        `src/serve/sse.ts`, `src/serve/server.test.ts`, and
        `src/serve/run-registry.test.ts`.

        Do all of the following:

        1. Run `openspec new change serve-and-viewer-fixes` to
           scaffold.
        2. Write proposal.md, design.md, the spec delta (if any) under
           `specs/serve-daemon/spec.md`, and tasks.md.
        3. Run `openspec validate serve-and-viewer-fixes` and iterate
           until it exits 0.

        ## Status signaling

        Your final assistant message MUST end with the literal
        `MINIFAC_STATUS:` sentinel line. The runner parses this line
        to decide whether to schedule the next node; it does not look
        at your CLI exit code.

        - On success (you got `openspec validate
          serve-and-viewer-fixes` to exit 0 and every required
          artifact is on disk), end your final message with exactly
          this line and nothing after it:

              MINIFAC_STATUS: succeeded

        - On failure (you could not get validate clean, or a required
          artifact could not be written), end your final message with
          exactly these two lines and nothing after them:

              MINIFAC_STATUS: failed
              REASON: <one-line description of the unresolved validation error>

        The sentinel must be the last thing in your message.

  apply:
    executor: claude
    cwd: /Users/jami/projects/minifac-sv-fixes
    with:
      permission_mode: "bypass_permissions"
      prompt: |
        You are running the apply step of the SDD loop for change
        serve-and-viewer-fixes. The propose step already landed the
        proposal, design, spec delta, and tasks under
        `openspec/changes/serve-and-viewer-fixes/`. Prior node output
        is in your run-wide history — if this is a retry, the verify
        failure that sent you back is in there too; read it and
        address it.

        Respect the project rules in `CLAUDE.md`. Do not add new
        runtime dependencies. Do not refactor unrelated code.

        Do all of the following:

        1. Read `openspec/changes/serve-and-viewer-fixes/tasks.md`.
        2. Work each unchecked `- [ ]` task. Make the code changes,
           mark each task `- [x]` as you finish it.
        3. Commit progress when it makes sense; do not push.

        ## Status signaling

        Your final assistant message MUST end with the literal
        `MINIFAC_STATUS:` sentinel line. The runner parses this line
        to decide whether to schedule the next node; it does not look
        at your CLI exit code.

        - On success (every checkbox in
          `openspec/changes/serve-and-viewer-fixes/tasks.md` is
          `- [x]`), end your final message with exactly this line and
          nothing after it:

              MINIFAC_STATUS: succeeded

        - On failure (a task is structurally impossible), end your
          final message with exactly these two lines and nothing
          after them:

              MINIFAC_STATUS: failed
              REASON: <one-line description naming the blocking task>

        The sentinel must be the last thing in your message.

  verify:
    executor: claude
    cwd: /Users/jami/projects/minifac-sv-fixes
    with:
      permission_mode: "bypass_permissions"
      prompt: |
        You are running the verify step of the SDD loop for change
        serve-and-viewer-fixes. Prior propose and apply output is in
        your run-wide history.

        Run the minifac repo's verify commands in the current
        directory:

            npm run build
            npm test
            npm run check
            openspec validate serve-and-viewer-fixes

        Do NOT start the daemon or hit any network — verify is a
        static-checks pass only.

        ## Status signaling

        Your final assistant message MUST end with the literal
        `MINIFAC_STATUS:` sentinel line. The runner parses this line
        to decide whether to schedule the next node; it does not look
        at your CLI exit code. Your failure output will be in the
        apply node's history on the next iteration, so the REASON
        line needs to be diagnosable.

        - On success (every verify command exited 0 and
          `openspec validate serve-and-viewer-fixes` is still clean),
          end your final message with exactly this line and nothing
          after it:

              MINIFAC_STATUS: succeeded

        - On failure (any verify command exited non-zero), end your
          final message with exactly these two lines and nothing
          after them:

              MINIFAC_STATUS: failed
              REASON: <one-line description naming the failing command and the relevant output>

        The sentinel must be the last thing in your message.

  archive:
    executor: claude
    cwd: /Users/jami/projects/minifac-sv-fixes
    terminal: true
    with:
      permission_mode: "bypass_permissions"
      prompt: |
        You are running the archive step of the SDD loop for change
        serve-and-viewer-fixes. Verify has passed. Prior node output
        is in your run-wide history.

        Run `openspec archive serve-and-viewer-fixes`. After it exits
        0, stage all changes and commit with subject
        `Archive: serve-and-viewer-fixes` and a 2-3 line body that
        describes what was folded into canonical specs and what
        change directory was moved. Include the trailing
        `Co-Authored-By: Claude Opus 4.7 (1M context)
        <noreply@anthropic.com>` line. Do not push.

        If `openspec archive` exits non-zero, do NOT commit. If the
        commit itself fails (e.g. a hook rejects), that is a node
        failure.

        ## Status signaling

        Your final assistant message MUST end with the literal
        `MINIFAC_STATUS:` sentinel line. The runner parses this line
        to decide whether to schedule the next node; it does not look
        at your CLI exit code.

        - On success (`openspec archive serve-and-viewer-fixes` exited
          0 AND the subsequent `git commit` exited 0), end your final
          message with exactly this line and nothing after it:

              MINIFAC_STATUS: succeeded

        - On failure (the archive command errored, or the commit was
          rejected), end your final message with exactly these two
          lines and nothing after them:

              MINIFAC_STATUS: failed
              REASON: <one-line description naming the archive or commit error>

        The sentinel must be the last thing in your message.

edges:
  - from: propose
    to: apply
  - from: apply
    to: verify
  - from: verify
    to: archive
  - from: verify
    to: apply
    when: on_failure
    max_traversals: 3
