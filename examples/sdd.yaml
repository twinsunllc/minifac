name: sdd
description: |
  The propose → apply → verify → archive loop, expressed as a factory.
  Brief-driven: author `inputs/<change>.md` referencing
  `factory: sdd`, then invoke `minifac run <change>`. Each node now
  references a reusable step under `examples/steps/`; the runner
  substitutes `{{ brief.change }}` and `{{ brief.body }}` into the
  per-node `inputs:` map before dispatch. See examples/sdd.md.

brief: required

nodes:
  propose:
    uses: minifac:openspec-propose
    inputs:
      change: "{{ brief.change }}"
      brief_body: "{{ brief.body }}"
    cwd: "{{ run.cwd }}"
  apply:
    uses: minifac:openspec-apply
    inputs:
      change: "{{ brief.change }}"
    cwd: "{{ run.cwd }}"
  verify:
    uses: minifac:openspec-verify
    inputs:
      change: "{{ brief.change }}"
    cwd: "{{ run.cwd }}"
  archive:
    uses: minifac:openspec-archive
    inputs:
      change: "{{ brief.change }}"
    cwd: "{{ run.cwd }}"
    terminal: true

edges:
  - from: propose
    to: apply
  - from: apply
    to: verify
  - from: verify
    to: archive
  - from: verify
    to: apply
    when: on_failure
    max_traversals: 3
