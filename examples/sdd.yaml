name: sdd
description: |
  The propose → apply → verify → archive loop, expressed as a factory.
  This is a template: copy it to sdd-<changename>.yaml and edit two things
  per node — the literal string <CHANGE_NAME> in each prompt, and the
  per-node `cwd` (currently a placeholder). See examples/sdd.md for the
  per-node contract and the copy-and-edit workflow.

nodes:
  propose:
    executor: claude
    cwd: /path/to/target/repo
    with:
      permission_mode: "bypass_permissions"
      prompt: |
        You are running the propose step of the SDD loop for change
        <CHANGE_NAME>. Work in the current directory, which is an
        OpenSpec-equipped repo.

        Do all of the following:

        1. Run `openspec new change <CHANGE_NAME>` to scaffold the change.
        2. Write `openspec/changes/<CHANGE_NAME>/proposal.md`,
           `design.md`, the spec deltas under `specs/`, and `tasks.md`.
        3. Run `openspec validate <CHANGE_NAME>` and iterate until it
           exits 0.

        ## Status signaling

        Your final assistant message MUST end with the literal
        `MINIFAC_STATUS:` sentinel line. The runner parses this line to
        decide whether to schedule the next node; it does not look at
        your CLI exit code.

        - On success (you got `openspec validate <CHANGE_NAME>` to exit
          0 and every required artifact is on disk), end your final
          message with exactly this line and nothing after it:

              MINIFAC_STATUS: succeeded

        - On failure (you could not get validate clean, or a required
          artifact could not be written), end your final message with
          exactly these two lines and nothing after them:

              MINIFAC_STATUS: failed
              REASON: <one-line description of the unresolved validation error>

        The sentinel must be the last thing in your message.

  apply:
    executor: claude
    cwd: /path/to/target/repo
    with:
      permission_mode: "bypass_permissions"
      prompt: |
        You are running the apply step of the SDD loop for change
        <CHANGE_NAME>. The propose step already landed the proposal,
        design, spec deltas, and tasks under
        `openspec/changes/<CHANGE_NAME>/`. Prior node output is in your
        run-wide history — if this is a retry, the verify failure that
        sent you back is in there too; read it and address it.

        Do all of the following:

        1. Read `openspec/changes/<CHANGE_NAME>/tasks.md`.
        2. Work each unchecked `- [ ]` task. Make the code changes,
           mark each task `- [x]` as you finish it.
        3. Commit progress when it makes sense; do not push.

        ## Status signaling

        Your final assistant message MUST end with the literal
        `MINIFAC_STATUS:` sentinel line. The runner parses this line to
        decide whether to schedule the next node; it does not look at
        your CLI exit code.

        - On success (every checkbox in
          `openspec/changes/<CHANGE_NAME>/tasks.md` is `- [x]`), end
          your final message with exactly this line and nothing after
          it:

              MINIFAC_STATUS: succeeded

        - On failure (a task is structurally impossible, e.g. it needs
          a schema change not in the proposal), end your final message
          with exactly these two lines and nothing after them:

              MINIFAC_STATUS: failed
              REASON: <one-line description naming the blocking task>

        The sentinel must be the last thing in your message.

  verify:
    executor: claude
    cwd: /path/to/target/repo
    with:
      permission_mode: "bypass_permissions"
      prompt: |
        You are running the verify step of the SDD loop for change
        <CHANGE_NAME>. Prior propose and apply output is in your
        run-wide history.

        Run the target repo's verify commands in the current directory.
        For most Node/TS repos that is:

            npm test
            npm run build
            npm run check

        Use whatever the target repo actually has. Then run
        `openspec validate <CHANGE_NAME>` once more to confirm the
        change is still clean.

        ## Status signaling

        Your final assistant message MUST end with the literal
        `MINIFAC_STATUS:` sentinel line. The runner parses this line to
        decide whether to schedule the next node; it does not look at
        your CLI exit code. Your failure output will be in the apply
        node's history on the next iteration, so the REASON line needs
        to be diagnosable.

        - On success (every verify command exited 0 and
          `openspec validate <CHANGE_NAME>` is still clean), end your
          final message with exactly this line and nothing after it:

              MINIFAC_STATUS: succeeded

        - On failure (any verify command exited non-zero), end your
          final message with exactly these two lines and nothing after
          them:

              MINIFAC_STATUS: failed
              REASON: <one-line description naming the failing command and the relevant output>

        The sentinel must be the last thing in your message.

  archive:
    executor: claude
    cwd: /path/to/target/repo
    terminal: true
    with:
      permission_mode: "bypass_permissions"
      prompt: |
        You are running the archive step of the SDD loop for change
        <CHANGE_NAME>. Verify has passed. Prior node output is in your
        run-wide history.

        Do all of the following, in this strict order:

        1. Run `openspec archive <CHANGE_NAME>`. This moves the change
           directory from `openspec/changes/<CHANGE_NAME>/` to
           `openspec/changes/archive/<dated>-<CHANGE_NAME>/` and folds
           the change's spec deltas into
           `openspec/specs/<capability>/spec.md`.
        2. If and only if step 1 exited 0, stage and commit the
           resulting file moves and spec folds:

               git add -A
               git commit -m "$(cat <<'EOF'
               Archive: <CHANGE_NAME>

               <2–3 line body summarising which capability specs were
               folded and which change directory was moved into
               openspec/changes/archive/>.

               Co-Authored-By: Claude Opus 4.7 (1M context) <noreply@anthropic.com>
               EOF
               )"

           If step 1 exited non-zero, do not attempt the commit.

        Do not push. This is a terminal node — success here ends the
        run; pushing to a remote is a human decision.

        ## Status signaling

        Your final assistant message MUST end with the literal
        `MINIFAC_STATUS:` sentinel line. The runner parses this line to
        decide whether to schedule the next node; it does not look at
        your CLI exit code.

        - On success (`openspec archive <CHANGE_NAME>` exited 0 AND
          the subsequent `git commit` exited 0), end your final
          message with exactly this line and nothing after it:

              MINIFAC_STATUS: succeeded

        - On failure (either `openspec archive` exited non-zero, or
          the `git commit` exited non-zero — for example because a
          pre-commit hook in the target repo rejected the commit),
          end your final message with exactly these two lines and
          nothing after them:

              MINIFAC_STATUS: failed
              REASON: <one-line description naming which step (openspec archive or git commit) failed and the relevant error>

        The sentinel must be the last thing in your message.

edges:
  - from: propose
    to: apply
  - from: apply
    to: verify
  - from: verify
    to: archive
  - from: verify
    to: apply
    when: on_failure
    max_traversals: 3
