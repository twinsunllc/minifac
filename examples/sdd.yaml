name: sdd
description: |
  The propose → apply → verify → archive loop, expressed as a factory.
  Brief-driven: author `inputs/<change>.md` referencing
  `factory: sdd`, then invoke `minifac run <change>`. The runner
  substitutes `{{ brief.change }}` and `{{ brief.body }}` from the
  brief before dispatching each node. See examples/sdd.md.

brief: required

nodes:
  propose:
    executor: claude
    cwd: "{{ run.cwd }}"
    with:
      permission_mode: "bypass_permissions"
      prompt: |
        You are running the propose step of the SDD loop for change
        {{ brief.change }}. Work in the current directory, which is an
        OpenSpec-equipped repo.

        ## Intent for this change

        {{ brief.body }}

        Do all of the following:

        1. Run `openspec new change {{ brief.change }}` to scaffold the change.
        2. Write `openspec/changes/{{ brief.change }}/proposal.md`,
           `design.md`, the spec deltas under `specs/`, and `tasks.md`.
        3. Run `openspec validate {{ brief.change }}` and iterate until it
           exits 0.

        Success means `openspec validate {{ brief.change }}` exits 0 and
        every required artifact (proposal, design, spec deltas, tasks)
        is on disk. Failure means validate could not be made clean or
        a required artifact could not be written.

  apply:
    executor: claude
    cwd: "{{ run.cwd }}"
    with:
      permission_mode: "bypass_permissions"
      prompt: |
        You are running the apply step of the SDD loop for change
        {{ brief.change }}. The propose step already landed the proposal,
        design, spec deltas, and tasks under
        `openspec/changes/{{ brief.change }}/`. Prior node output is in your
        run-wide history — if this is a retry, the verify failure that
        sent you back is in there too; read it and address it.

        Do all of the following:

        1. Read `openspec/changes/{{ brief.change }}/tasks.md`.
        2. Work each unchecked `- [ ]` task. Make the code changes,
           mark each task `- [x]` as you finish it.
        3. Commit progress when it makes sense; do not push.

        Success means every `- [ ]` checkbox in
        `openspec/changes/{{ brief.change }}/tasks.md` is `- [x]`. Failure
        means a task is structurally blocked (for example, it requires
        a schema change not in the proposal).

  verify:
    executor: claude
    cwd: "{{ run.cwd }}"
    with:
      permission_mode: "bypass_permissions"
      prompt: |
        You are running the verify step of the SDD loop for change
        {{ brief.change }}. Prior propose and apply output is in your
        run-wide history.

        Run the target repo's verify commands in the current directory.
        For most Node/TS repos that is:

            npm test
            npm run build
            npm run check

        Use whatever the target repo actually has. Then run
        `openspec validate {{ brief.change }}` once more to confirm the
        change is still clean.

        Success means every verify command exited 0 (and
        `openspec validate {{ brief.change }}` is still clean). Failure
        means any verify command exited non-zero. On failure, name the
        failing command and the diagnosable output — that text is what
        the next `apply` iteration reads out of `ctx.history`, so make
        it actionable.

  archive:
    executor: claude
    cwd: "{{ run.cwd }}"
    terminal: true
    with:
      permission_mode: "bypass_permissions"
      prompt: |
        You are running the archive step of the SDD loop for change
        {{ brief.change }}. Verify has passed. Prior node output is in your
        run-wide history.

        Do all of the following, in this strict order:

        1. Run `openspec archive {{ brief.change }} --yes`. (The
           `--yes` flag is required: the CLI prompts interactively
           for confirmation when a change has many spec deltas, and
           a spawned non-interactive session cannot answer.) This
           moves the change directory from
           `openspec/changes/{{ brief.change }}/` to
           `openspec/changes/archive/<dated>-{{ brief.change }}/` and folds
           the change's spec deltas into
           `openspec/specs/<capability>/spec.md`.
        2. If and only if step 1 exited 0, stage and commit the
           resulting file moves and spec folds:

               git add -A
               git commit -m "$(cat <<'EOF'
               Archive: {{ brief.change }}

               <2–3 line body summarising which capability specs were
               folded and which change directory was moved into
               openspec/changes/archive/>.

               Co-Authored-By: Claude Opus 4.7 (1M context) <noreply@anthropic.com>
               EOF
               )"

           If step 1 exited non-zero, do not attempt the commit.

        Do not push. This is a terminal node — success here ends the
        run; pushing to a remote is a human decision.

        Success means `openspec archive {{ brief.change }}` exited 0 AND
        the subsequent `git commit` exited 0. Failure means either
        step exited non-zero (for example, a pre-commit hook in the
        target repo rejecting the commit). On failure, name which
        step (`openspec archive` or `git commit`) failed and the
        relevant error.

edges:
  - from: propose
    to: apply
  - from: apply
    to: verify
  - from: verify
    to: archive
  - from: verify
    to: apply
    when: on_failure
    max_traversals: 3
